services:

  user-service:
    image: pamothkumarasinghe/resqhub-user-service:latest
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - resqhub-network

  organization-service:
    image: pamothkumarasinghe/resqhub-organization-service:latest
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - resqhub-network

  resource-service:
    image: pamothkumarasinghe/resqhub-resource-service:latest
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - resqhub-network

  request-service:
    image: pamothkumarasinghe/resqhub-request-service:latest
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - resqhub-network

  task-service:
    image: pamothkumarasinghe/resqhub-task-service:latest
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - resqhub-network

  volunteer-service:
    image: pamothkumarasinghe/resqhub-volunteer-service:latest
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - resqhub-network

  notification-service:
    image: pamothkumarasinghe/resqhub-notification-service:latest
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - resqhub-network

  api-gateway:
    image: pamothkumarasinghe/resqhub-api-gateway:latest
    restart: unless-stopped
    # Kong is no longer exposed directly to the internet.
    # Only nginx talks to it via the internal Docker network.
    expose:
      - "3000"
    depends_on:
      - user-service
      - organization-service
      - resource-service
      - request-service
      - task-service
      - volunteer-service
      - notification-service
    networks:
      - resqhub-network

  # ── Nginx: SSL termination reverse proxy ─────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP → redirects to HTTPS
      - "443:443"  # HTTPS → proxied to Kong
    volumes:
      # Nginx config
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt certs (written by certbot)
      - certbot-certs:/etc/letsencrypt:ro
      # Certbot ACME challenge webroot
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api-gateway
    networks:
      - resqhub-network

  # ── Certbot: auto-renews Let's Encrypt SSL certificates ──────────────────
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      # Certs are written here and read by nginx
      - certbot-certs:/etc/letsencrypt
      # Webroot for ACME http-01 challenge
      - certbot-www:/var/www/certbot
    # Renews certs every 12 hours (only actually renews when < 30 days remain)
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  certbot-certs:
  certbot-www:

networks:
  resqhub-network:
    driver: bridge

