# Stage 1: Obtain the certificate using certbot standalone mode
# This runs BEFORE nginx, obtains the cert, then exits.
# nginx then starts using the cert.

# Nginx config for HTTPS reverse proxy in front of Kong
# This file is used in the nginx container in docker-compose.prod.yml

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name api.resqhub.mrt.lk;

    # Allow Let's Encrypt ACME challenge for cert renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server — proxies to Kong on port 3000
server {
    listen 443 ssl;
    server_name api.resqhub.mrt.lk;

    # SSL certificates issued by Let's Encrypt via Certbot
    ssl_certificate     /etc/letsencrypt/live/api.resqhub.mrt.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.resqhub.mrt.lk/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # Proxy all requests to Kong (api-gateway service on the Docker network)
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kong_upstream api-gateway:3000;
        proxy_pass http://$kong_upstream;
        proxy_http_version 1.1;

        # Pass real client info to Kong
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for notification-service)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
