# ─────────────────────────────────────────────────────────────────────────────
#  Task Service CI
# ─────────────────────────────────────────────────────────────────────────────
name: Task Service CI
on:
  push:
    branches: [dev, main]
    paths:
      - "services/task-service/**"
      - "packages/shared-middleware/**"
      - ".github/workflows/task-service-ci.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "services/task-service/**"
      - "packages/shared-middleware/**"
      - ".github/workflows/task-service-ci.yml"
concurrency:
  group: task-service-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install:
    name: Install & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm audit --audit-level=high --workspace=services/task-service || true
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: services/task-service/Dockerfile
          push: false
          tags: crp/task-service:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
