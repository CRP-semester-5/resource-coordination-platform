name: Build, Push and Deploy Microservices

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            file: services/user-service/Dockerfile
            image: resqhub-user-service

          - service: organization-service
            file: services/organization-service/Dockerfile
            image: resqhub-organization-service

          - service: resource-service
            file: services/resource-service/Dockerfile
            image: resqhub-resource-service

          - service: request-service
            file: services/request-service/Dockerfile
            image: resqhub-request-service

          - service: task-service
            file: services/task-service/Dockerfile
            image: resqhub-task-service

          - service: volunteer-service
            file: services/volunteer-service/Dockerfile
            image: resqhub-volunteer-service

          - service: notification-service
            file: services/notification-service/Dockerfile
            image: resqhub-notification-service

          - service: api-gateway
            file: api-gateway/Dockerfile
            image: resqhub-api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Deploy latest images to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/resqhub

            echo "Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull

            echo "Restarting containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Removing unused images..."
            docker image prune -f

            echo "Deployment status:"
            docker compose -f docker-compose.prod.yml ps
