# ─────────────────────────────────────────────────────────────────────────────
#  Frontend CI
# ─────────────────────────────────────────────────────────────────────────────
name: Frontend CI
on:
  push:
    branches: [dev, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Set up Node.js 22 (Fallback)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Build
        run: npm run build
