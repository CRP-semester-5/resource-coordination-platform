name: Build and Push Microservices

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      # If one build fails, don't cancel the others
      fail-fast: false
      matrix:
        include:
          - service: user-service
            file: services/user-service/Dockerfile
            image: resqhub-user-service

          - service: organization-service
            file: services/organization-service/Dockerfile
            image: resqhub-organization-service

          - service: resource-service
            file: services/resource-service/Dockerfile
            image: resqhub-resource-service

          - service: request-service
            file: services/request-service/Dockerfile
            image: resqhub-request-service

          - service: task-service
            file: services/task-service/Dockerfile
            image: resqhub-task-service

          - service: volunteer-service
            file: services/volunteer-service/Dockerfile
            image: resqhub-volunteer-service

          - service: notification-service
            file: services/notification-service/Dockerfile
            image: resqhub-notification-service

          - service: api-gateway
            file: api-gateway/Dockerfile
            image: resqhub-api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # CRITICAL: The context MUST be the root ('.') because of your npm workspaces
          context: .
          file: ${{ matrix.file }}
          push: true
          # Note: arm64 takes significantly longer on GitHub's free runners. 
          # Remove it if you only deploy to standard x86/amd64 AWS EC2 instances.
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
