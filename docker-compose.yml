version: "3.9"

# ─────────────────────────────────────────────────────────────────
#  Resource Coordination Platform — Docker Compose
#
#  Database: Supabase (hosted) — no local DB container needed.
#  All services connect via SUPABASE_URL / DATABASE_URL from .env
#
#  NOTE: All build contexts are set to root (.) so Docker can
#  access the root package-lock.json required by npm workspaces.
# ─────────────────────────────────────────────────────────────────

networks:
  crp-network:
    driver: bridge

services:

  # ── API Gateway ──────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: crp-api-gateway
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - USER_SERVICE_URL=http://user-service:3001
      - ORGANIZATION_SERVICE_URL=http://organization-service:3002
      - RESOURCE_SERVICE_URL=http://resource-service:3003
      - REQUEST_SERVICE_URL=http://request-service:3004
      - TASK_SERVICE_URL=http://task-service:3005
      - VOLUNTEER_SERVICE_URL=http://volunteer-service:3006
      - NOTIFICATION_SERVICE_URL=http://notification-service:3007
    depends_on:
      - user-service
      - organization-service
      - resource-service
      - request-service
      - task-service
      - volunteer-service
      - notification-service
    networks:
      - crp-network
    restart: unless-stopped

  # ── User Service ─────────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: crp-user-service
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - crp-network
    restart: unless-stopped

  # ── Organization Service ─────────────────────────────────────
  organization-service:
    build:
      context: .
      dockerfile: services/organization-service/Dockerfile
    container_name: crp-organization-service
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3002
    networks:
      - crp-network
    restart: unless-stopped

  # ── Resource Service ─────────────────────────────────────────
  resource-service:
    build:
      context: .
      dockerfile: services/resource-service/Dockerfile
    container_name: crp-resource-service
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3003
    networks:
      - crp-network
    restart: unless-stopped

  # ── Request Service ──────────────────────────────────────────
  request-service:
    build:
      context: .
      dockerfile: services/request-service/Dockerfile
    container_name: crp-request-service
    ports:
      - "3004:3004"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3004
    networks:
      - crp-network
    restart: unless-stopped

  # ── Task Service ─────────────────────────────────────────────
  task-service:
    build:
      context: .
      dockerfile: services/task-service/Dockerfile
    container_name: crp-task-service
    ports:
      - "3005:3005"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3005
    networks:
      - crp-network
    restart: unless-stopped

  # ── Volunteer Service ────────────────────────────────────────
  volunteer-service:
    build:
      context: .
      dockerfile: services/volunteer-service/Dockerfile
    container_name: crp-volunteer-service
    ports:
      - "3006:3006"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3006
    networks:
      - crp-network
    restart: unless-stopped

  # ── Notification Service ─────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: crp-notification-service
    ports:
      - "3007:3007"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3007
    networks:
      - crp-network
    restart: unless-stopped
